[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rba-idp"
version = "0.5.0"
description = "Thesis-scale IdP (PEP): hosted login, PDP enforce, session, WebAuthn MFA, admin console, groups, thin callback."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Juan Ignacio Gonzalez" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "bcrypt>=4.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "webauthn>=2.2,<3",
    "maxminddb>=2.5",
    "prometheus-client>=0.20",
    "rba-contracts>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rba_idp = [
  "web/templates/*.html",
  "web/static/*",
  # The self-hosted woff2 files; "web/static/*" does not reach into it.
  "web/static/fonts/*",
  "web/static/brand/*",
  "data/*.json",
  "web/admin/*",
  "web/admin/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
