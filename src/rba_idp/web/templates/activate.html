<!DOCTYPE html>
<html lang="es" data-look="rokusec">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activar passkey · RokuSec</title>
  <link rel="icon" href="/static/brand/favicon.svg?v={{ v }}" type="image/svg+xml">
  <link rel="icon" href="/static/brand/favicon-32.png?v={{ v }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png?v={{ v }}">
  <link rel="stylesheet" href="/static/login.css?v={{ v }}">
</head>
<body>
  <div class="page">
    <div class="pane">
      <header class="brand">
        <img class="brand-logo" src="/static/brand/rokusec-logo-horizontal.svg?v={{ v }}" alt="RokuSec" width="82" height="36">
      </header>

      <main class="card">
        <section id="panel-form">
          <h1>Activá tu passkey</h1>
          <p class="lede">Con el código que te dio soporte. Sirve una vez y vence en 15 minutos.</p>
          <form id="form-activate" autocomplete="off">
            <label for="code">Código de activación</label>
            <input id="code" name="code" required autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p class="form-error" id="activate-error" hidden></p>
            <button type="submit" id="activate-submit">Continuar</button>
          </form>
        </section>

        <section id="panel-create" hidden>
          <h1>Creá tu passkey</h1>
          <p class="lede">Tu dispositivo te va a pedir la huella, la cara o el bloqueo de pantalla.</p>
          <p class="hint" id="create-inapp" hidden></p>
          <p class="form-error" id="create-error" hidden></p>
          <button type="button" id="create-submit">Crear passkey</button>
          <p class="hint" id="create-wait" hidden></p>
        </section>

        <section id="panel-done" hidden>
          <h1>Passkey lista</h1>
          <p class="lede">Volvé a la aplicación e iniciá sesión.</p>
        </section>
      </main>

      <footer class="foot"><a href="https://db-ip.com" rel="noopener">Geolocalización IP por DB-IP</a></footer>
    </div>
  </div>

  <script src="/static/form.js?v={{ v }}"></script>
  <script src="/static/passkey.js?v={{ v }}"></script>
  <script src="/static/activate.js?v={{ v }}"></script>
</body>
</html>
